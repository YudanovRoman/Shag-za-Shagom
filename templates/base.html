<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width,
                   initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="static/css/light_theme.css" media="screen" />
    <link rel="SHORTCUT ICON" href="static/img/boot.ico" type="image/x-icon">
</head>

<body class="light_theme">
    <div class="navbar" id="myNavbar">
        <p href="Home" class="logo">
            <img src="static/img/logo.jpg" alt="logo" height="62" width="150">
        </p>
        <div class="menu">
            <a href="Home">Home</a>
            {% if autorization == "Registration" %}
            <a href=Registration>{{ autorization }}</a>
            {% else %}
            <a href="Profile">{{ autorization }}</a>
            {% endif %}
            <a href="Info">About us</a>
        </div>

        <a href="javascript:void(0);"
           class="icon" 
           onclick="toggleMenu()">
            &#9776;
        </a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div class="container_bottom">
            <button id="theme-toggle" class="themeChangeBtn light">
                <img class="btn_img" id="imgClickAndChange" src="static/img/sun_button.png" alt="image" height="35" wigth="35">
            </button>
        </div>
    </footer>
    <script src="static/base.js"></script>
</body>

</html>
